<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1020" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .step{stroke:#333;stroke-width:1.5;}
    .dec{stroke:#333;stroke-width:1.5;}
    .lbl{font-size:13px;fill:#111;}
    .sub{font-size:10.5px;fill:#333;}
    .edge{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#arrow2);}
    .elbl{font-size:10.5px;fill:#333;}
  </style>

  <rect x="0" y="0" width="760" height="1020" fill="#fff"/>

  <rect x="230" y="20" width="300" height="60" rx="30" class="step" fill="#E8F0FE"/>
  <text x="380" y="45" text-anchor="middle" class="lbl">Packet arrives on s1-eth1/2/3</text>
  <text x="380" y="62" text-anchor="middle" class="sub">NIC offloads (TSO/GSO/GRO) must be off</text>

  <path class="edge" d="M380,80 V110"/>

  <rect x="190" y="110" width="380" height="60" rx="8" class="step" fill="#FFF3CD"/>
  <text x="380" y="135" text-anchor="middle" class="lbl">Group into flow (5-tuple) window</text>
  <text x="380" y="152" text-anchor="middle" class="sub">drop TCP control packets: len(tcp.payload)==0</text>

  <path class="edge" d="M380,170 V200"/>

  <rect x="190" y="200" width="380" height="80" rx="8" class="step" fill="#FFF3CD"/>
  <text x="380" y="222" text-anchor="middle" class="lbl">Window of 20 packets reached?</text>
  <text x="380" y="240" text-anchor="middle" class="sub">timestamps use float(pkt.time), not time.time()</text>
  <text x="380" y="256" text-anchor="middle" class="sub">No &#8594; keep collecting (loops back up)</text>
  <text x="380" y="270" text-anchor="middle" class="sub">Yes &#8594; compute_features()</text>
  <path class="edge" d="M190,240 Q140,240 140,155 Q140,130 188,130"/>
  <text x="105" y="190" text-anchor="middle" class="elbl" transform="rotate(-90 105,190)">not yet 20 pkts</text>

  <path class="edge" d="M380,280 V310"/>

  <rect x="150" y="310" width="460" height="85" rx="8" class="step" fill="#E6DFF7"/>
  <text x="380" y="332" text-anchor="middle" class="lbl">compute_features() &#8212; six features</text>
  <text x="380" y="350" text-anchor="middle" class="sub">mean_size, std_size, mean_iat, std_iat,</text>
  <text x="380" y="366" text-anchor="middle" class="sub">burstiness = std_size/mean_size,</text>
  <text x="380" y="382" text-anchor="middle" class="sub">byte_rate = total_bytes / window_duration</text>

  <path class="edge" d="M380,395 V425"/>

  <polygon points="380,425 530,480 380,535 230,480" class="dec" fill="#FDE2E2"/>
  <text x="380" y="476" text-anchor="middle" class="lbl">Trained model</text>
  <text x="380" y="492" text-anchor="middle" class="lbl">loaded?</text>

  <path class="edge" d="M380,535 V570"/>
  <text x="400" y="555" class="elbl">yes</text>
  <rect x="230" y="570" width="300" height="60" rx="8" class="step" fill="#D9F2E6"/>
  <text x="380" y="594" text-anchor="middle" class="lbl">Decision tree (depth 4)</text>
  <text x="380" y="610" text-anchor="middle" class="sub">model.real.joblib, 6-feature vector</text>

  <path class="edge" d="M230,480 H100 V600 H228"/>
  <text x="130" y="470" class="elbl">no</text>
  <rect x="-10" y="570" width="240" height="60" rx="8" class="step" fill="#F8D7DA" transform="translate(20,0)"/>
  <text x="130" y="594" text-anchor="middle" class="lbl">Rule-based fallback</text>
  <text x="130" y="610" text-anchor="middle" class="sub">mean_size/burstiness/mean_iat thresholds</text>

  <path class="edge" d="M380,630 V660"/>
  <path class="edge" d="M130,630 Q130,660 230,660"/>

  <rect x="230" y="660" width="300" height="55" rx="27" class="step" fill="#E8F0FE"/>
  <text x="380" y="692" text-anchor="middle" class="lbl">Tier: realtime | besteffort | bulk</text>

  <path class="edge" d="M380,715 V745"/>

  <rect x="190" y="745" width="380" height="60" rx="8" class="step" fill="#FDE2E2"/>
  <text x="380" y="768" text-anchor="middle" class="lbl">bridge.py POSTs /classify to controller</text>
  <text x="380" y="785" text-anchor="middle" class="sub">{dpid, tier, src_ip, dst_ip, src_port, dst_port, ip_proto}</text>

  <path class="edge" d="M380,805 V835"/>

  <polygon points="380,835 530,890 380,945 230,890" class="dec" fill="#D9F2E6"/>
  <text x="380" y="886" text-anchor="middle" class="lbl">priority_engine_on?</text>

  <path class="edge" d="M230,890 H110 V905"/>
  <text x="95" y="925" text-anchor="middle" class="elbl">False &#8594;</text>
  <text x="95" y="939" text-anchor="middle" class="elbl">OFPActionOutput</text>
  <text x="95" y="953" text-anchor="middle" class="elbl">(NORMAL) only,</text>
  <text x="95" y="967" text-anchor="middle" class="elbl">no queue set</text>
  <rect x="15" y="900" width="160" height="10" fill="none"/>

  <path class="edge" d="M530,890 H640 V130"/>
  <text x="560" y="880" class="elbl" transform="rotate(-90 560,880)">True</text>
  <rect x="540" y="60" width="200" height="70" rx="8" class="step" fill="#D9F2E6"/>
  <text x="640" y="82" text-anchor="middle" class="lbl">Install OpenFlow rule</text>
  <text x="640" y="98" text-anchor="middle" class="sub">priority 25,</text>
  <text x="640" y="113" text-anchor="middle" class="sub">SetQueue(0/1/2) + NORMAL</text>

  <text x="10" y="998" class="sub" font-style="italic">Source: classifier/traffic_classifier.py (compute_features, classify_stream),</text>
  <text x="10" y="1011" class="sub" font-style="italic">controller/priority_controller.py (install_priority_flow).</text>
</svg>
